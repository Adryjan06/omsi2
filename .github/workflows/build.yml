name: Build OMSI64

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\src\Omsi64.Engine\Omsi64.Engine.csproj

      - name: Build x64
        run: dotnet build .\src\Omsi64.Engine\Omsi64.Engine.csproj -c Release --no-restore
